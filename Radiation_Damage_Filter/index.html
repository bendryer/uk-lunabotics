<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CCD Damage Simulator</title>
    <script type="module" crossorigin src="./assets/index-D4DqbQcL.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BEl1TB1O.css">
  </head>
  <body>
    <div id="main-wrapper">
      <div id="app-container">
        <canvas id="renderCanvas"></canvas>

        <div id="controls">
          <div class="control-group">
            <span>Scene:</span>
            <input type="radio" id="cameraScene" name="sceneSelect" value="camera" checked>
            <label for="cameraScene">Live Camera</label>
            <input type="radio" id="starfieldScene" name="sceneSelect" value="starfield">
            <label for="starfieldScene">Starfield</label>
            <input type="radio" id="astronautScene" name="sceneSelect" value="astronaut">
            <label for="astronautScene">Astronaut</label>
            <input type="radio" id="planetScene" name="sceneSelect" value="planet">
            <label for="planetScene">Planet</label>
          </div>
          <div class="control-group">
            <label for="resolutionSlider">Resolution:</label>
            <input type="range" id="resolutionSlider" min="0" max="1" step="0.01" value="0">
            
            <!-- NEW: Moved and simplified resolution readout -->
            <span id="resolution-readout" class="resolution-text"></span>

            <label for="bwCheckbox">B&W:</label>
            <input type="checkbox" id="bwCheckbox">
          </div>
          <div class="control-group">
            <label for="brightPixelSlider">Bright Pixels:</label>
            <input type="range" id="brightPixelSlider" min="0" max="1" step="0.01" value="0">
            <label for="ctiSlider">CTI Smear:</label>
            <input type="range" id="ctiSlider" min="0" max="1" step="0.01" value="0">
          </div>
        </div>
      </div>
    </div>

    <!-- Hidden video elements for scene textures -->
    <div id="video-sources" style="display: none;">
        <video id="cameraVideo" autoplay playsinline muted crossOrigin="anonymous"></video>
        <video id="astronautVideo" loop playsinline muted crossOrigin="anonymous"></video>
        <video id="planetVideo" loop playsinline muted crossOrigin="anonymous"></video>
    </div>

  </body>
</html>
